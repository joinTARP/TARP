name: 安装仓库开发环境
description: 安装根级 packageManager 指定的 Bun 和 workspace 依赖
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - name: 定位下载缓存目录
      id: cache-paths
      shell: bash
      run: |
        bun run - <<'JS' >> "$GITHUB_OUTPUT"
        const { homedir } = require('node:os');
        const { join } = require('node:path');
        console.log(`bun=${process.env.BUN_INSTALL_CACHE_DIR || join(homedir(), '.bun', 'install', 'cache')}`);
        console.log(`hutch=${process.env.HUTCH_HOME || process.env.DASH_HOME || join(homedir(), '.hutch')}`);
        JS
    - name: 缓存 Bun 依赖下载
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-paths.outputs.bun }}
        key: bun-download-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
        restore-keys: |
          bun-download-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: 缓存 Hutch 与 Electrobun 工具链
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.cache-paths.outputs.hutch }}/npm
          ${{ steps.cache-paths.outputs.hutch }}/releases
          ${{ steps.cache-paths.outputs.hutch }}/toolchains
        key: desktop-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock', 'apps/desktop/package.json', 'apps/desktop/hutch.config.ts') }}
        restore-keys: |
          desktop-tools-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: 从根目录安装依赖
      shell: bash
      env:
        SIMPLE_GIT_HOOKS: "0"
      run: bun install --frozen-lockfile
    - name: 安装 Linux 系统 WebView 依赖
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2
