name: 发布桌面安装包

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    uses: ./.github/workflows/build-desktop.yml
    with:
      sign: true
    secrets: inherit

  release:
    name: 汇总安装包并创建 Release 草稿
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: 附加对应源码和校验和
        run: |
          git archive --format=tar.gz --prefix="tarp-$GITHUB_REF_NAME/" --output="release-assets/tarp-$GITHUB_REF_NAME-source.tar.gz" HEAD
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
      - name: 创建或更新草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/draft.sh release-assets
