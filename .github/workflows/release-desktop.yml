name: 发布桌面安装包

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    uses: ./.github/workflows/build-desktop.yml
    with:
      sign: true
    secrets: inherit

  release:
    name: 汇总安装包并创建 Release 草稿
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: desktop-artifacts
          merge-multiple: true
      - name: 整理安装包、更新文件和校验和
        run: |
          version=${GITHUB_REF_NAME#desktop-v}
          mkdir release-assets
          cp desktop-artifacts/win-x64-TARP-Setup.zip "release-assets/TARP-$version-windows-x64-setup.zip"
          cp desktop-artifacts/macos-arm64-TARP.dmg "release-assets/TARP-$version-macos-arm64.dmg"
          cp desktop-artifacts/linux-x64-TARP-Setup.tar.gz "release-assets/TARP-$version-linux-x64-setup.tar.gz"
          cp desktop-artifacts/stable-*.tar.zst desktop-artifacts/stable-*-update.json release-assets/
          shopt -s nullglob
          for patch in desktop-artifacts/stable-*.patch; do
            cp "$patch" release-assets/
          done
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
      - name: 创建或更新草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/draft.sh release-assets
