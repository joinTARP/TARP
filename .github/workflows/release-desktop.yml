name: 发布桌面安装包

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: 构建 ${{ matrix.platform }} ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 校验 tag 与桌面版本
        run: |
          bun run - <<'JS'
          const { version } = require('./apps/desktop/package.json');
          if (process.env.GITHUB_REF_NAME !== `desktop-v${version}`) {
            throw new Error(`tag 必须为 desktop-v${version}`);
          }
          JS
      - name: 导入 macOS 签名证书
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$MAC_CSC_LINK" ]]; then exit 0; fi
          python3 - <<'PYTHON'
          import base64, os, pathlib, urllib.request
          value = os.environ['MAC_CSC_LINK']
          data = urllib.request.urlopen(value).read() if value.startswith('https://') else base64.b64decode(value)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'tarp-signing.p12').write_bytes(data)
          PYTHON
          TARP_KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          TARP_KEYCHAIN="$RUNNER_TEMP/tarp-signing.keychain-db"
          security create-keychain -p "$TARP_KEYCHAIN_PASSWORD" "$TARP_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TARP_KEYCHAIN"
          security unlock-keychain -p "$TARP_KEYCHAIN_PASSWORD" "$TARP_KEYCHAIN"
          security import "$RUNNER_TEMP/tarp-signing.p12" -k "$TARP_KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$TARP_KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$TARP_KEYCHAIN_PASSWORD" "$TARP_KEYCHAIN"
      - name: 构建安装包
        working-directory: apps/desktop
        env:
          TARP_CODESIGN: ${{ secrets.MAC_DEVELOPER_ID != '' && matrix.platform == 'mac' && '1' || '0' }}
          TARP_NOTARIZE: ${{ secrets.MAC_DEVELOPER_ID != '' && secrets.APPLE_ID != '' && matrix.platform == 'mac' && '1' || '0' }}
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.platform == 'mac' && secrets.MAC_DEVELOPER_ID || '' }}
          ELECTROBUN_APPLEID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          ELECTROBUN_APPLEIDPASS: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          ELECTROBUN_TEAMID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: bun run dist
      - name: 验证打包后的 Bun、CLI、模组、Wasm 和 SQLite
        run: bun scripts/release/smoke.ts desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.tar.zst
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.json
            apps/desktop/release/*.patch
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: 汇总安装包并创建 Release 草稿
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: 附加对应源码和校验和
        run: |
          git archive --format=tar.gz --prefix="tarp-$GITHUB_REF_NAME/" --output="release-assets/tarp-$GITHUB_REF_NAME-source.tar.gz" HEAD
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
      - name: 创建或更新草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/draft.sh release-assets
