name: 发布模组 CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    name: 打包、验收并创建 Release 草稿
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 准备 CLI 兼容性验收运行时
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - name: 校验 tag 与 CLI 版本
        run: |
          bun run - <<'JS'
          const { version } = require('./packages/module-cli/package.json');
          if (process.env.GITHUB_REF_NAME !== `cli-v${version}`) {
            throw new Error(`tag 必须为 cli-v${version}`);
          }
          JS
      - run: bun run --filter @jointarp/module-cli pack
      - run: bun scripts/release/smoke.ts cli
      - name: 整理发布包、对应源码和校验和
        run: |
          mkdir release-assets
          cp packages/module-cli/out/tarp-module-cli.tgz "release-assets/tarp-$GITHUB_REF_NAME.tgz"
          git archive --format=tar.gz --prefix="tarp-$GITHUB_REF_NAME/" --output="release-assets/tarp-$GITHUB_REF_NAME-source.tar.gz" HEAD
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
      - name: 创建或更新草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/draft.sh release-assets
